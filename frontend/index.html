<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memora AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div>
        <h1>🧠 MEMORA</h1>
        <p>AI Assistant with Memory</p>
      </div>
      <div class="status">
        <span class="status-dot"></span> Online
      </div>
    </header>

    <!-- MAIN -->
    <main class="main">
      <!-- CHAT -->
      <section class="chat-section">
        <div id="chatBox" class="chat-box">
          <div class="welcome">
            <div class="welcome-icon">🧠</div>
            <h2>Welcome to Memora</h2>
            <p>I remember useful information from previous conversations.</p>
            <div class="demo-tip">
              💡 Demo: Try saying "I'm learning Python and AI."
            </div>
          </div>
        </div>

        <!-- INPUT -->
        <div class="input-area">
          <textarea id="messageInput" placeholder="Type a message..." rows="2"></textarea>
          <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>

        <!-- NEW CONVERSATION -->
        <button class="new-chat" onclick="newConversation()">
          🔄 Start New Conversation
        </button>
      </section>

      <!-- RIGHT SIDEBAR (Memory + Activity) -->
      <aside class="sidebar">
        <!-- MY MEMORY -->
        <div class="memory-section">
          <div class="memory-header">
            <h2>🧠 MY MEMORY</h2>
            <span id="memoryCount">0</span>
          </div>
          <div id="memoryList" class="memory-list">
            <div class="empty-memory">No memories recalled yet.</div>
          </div>
        </div>

        <!-- MEMORY ACTIVITY -->
        <div class="memory-activity-section">
          <div class="memory-header">
            <h2>⚡ MEMORY ACTIVITY</h2>
          </div>
          <div id="activityList" class="activity-list">
            <div class="empty-activity">No activity yet.</div>
          </div>
        </div>
      </aside>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
